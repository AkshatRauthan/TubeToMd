name: Deploy Node Backend to Hugging Face
on:
  push:
    branches: [ TubeToMD-Prod ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Deploy to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BACKEND_SPACE: ${{ secrets.HF_BACKEND_SPACE }}
        run: |
          # Upload directly via HF Hub API
          hf upload $HF_BACKEND_SPACE ./backend . --repo-type space --token $HF_TOKEN
