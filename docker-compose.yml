services:
  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: tubetomd_python
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: always
    volumes:
      - ./python:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tubetomd_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PYTHON_SERVICE_URL=http://python:8000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_KEYS=${NVIDIA_API_KEYS}
      - NVIDIA_MODEL_QUALITY=${NVIDIA_MODEL_QUALITY}
      - NVIDIA_MODEL_FAST=${NVIDIA_MODEL_FAST}
      - NVIDIA_MODEL_IMAGE=${NVIDIA_MODEL_IMAGE}
      - IMAGE_GEN_DAILY_QUOTA_PER_USER=${IMAGE_GEN_DAILY_QUOTA_PER_USER}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
    depends_on:
      - python
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tubetomd_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
