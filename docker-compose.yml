version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: tubetomd_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: tubetomd_python
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: always
    volumes:
      - ./python:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tubetomd_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/tubetomd
      - JWT_SECRET=${JWT_SECRET}
      - PYTHON_SERVICE_URL=http://python:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb
      - python
    restart: always
    # Enable mapping local volumes for dev optionally
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tubetomd_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
